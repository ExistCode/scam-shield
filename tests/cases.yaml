  accept: [WASPADA]
- id: aman_promo_bank
  type: text
  text: "Nikmati cashback 10% belanja di Alfamart dengan kartu debit BCA sampai 30 November. Info lengkap ada di aplikasi BCA mobile."
  expected: AMAN
  accept: [WASPADA]
- id: investasi_ai_robot
  type: text
  text: "Gabung komunitas AI Robot Trading! Robot kami trading otomatis 24 jam, profit 3% per hari dijamin. Deposit min Rp1 jt ke rekening admin BCA 8830123456, withdraw kapan saja."
  expected: BAHAYA
  must_mention: ["081-157-157-157"]
- id: phishing_undian
  type: text
  text: "Selamat! Anda terpilih mendapat hadiah undian Shopee 2026 senilai Rp25 juta. Klaim sebelum jam 18.00 di http://shopee-undian-hadiah.click/klaim dan isi data rekening Anda."
