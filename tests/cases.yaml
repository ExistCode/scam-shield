- id: pinjol
  type: text
  text: "Pinjaman cair 10 jt dalam 5 menit tanpa BI checking! Cukup KTP. Bayar biaya admin Rp350rb dulu, dana langsung masuk. Daftar: http://pinjaman-cair-kilat.online"
  expected: BAHAYA
- id: emas_palsu
  type: text
  text: "Promo emas Antam 1 gram hanya Rp700rb khusus hari ini! Pesan di https://logammulia-antam-promo.shop lalu transfer ke rekening admin."
