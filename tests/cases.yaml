  type: text
  text: "Info dari grup RT: besok ada penyuluhan dari OJK di balai warga jam 9 pagi tentang cara menghindari penipuan online. Gratis, tidak perlu daftar."
  expected: AMAN
  accept: [WASPADA]
# ---- false-positive controls: everyday messages a parent forwards "just to check".
# The clearly harmless ones are strict AMAN (no WASPADA allowed) so over-flagging shows up.
- id: aman_posyandu
  type: text
  text: "Bu, posyandu lansia besok jam 8 pagi di balai RW 05 ya. Bawa KTP dan buku kesehatan. Ada cek tensi dan gula darah gratis."
