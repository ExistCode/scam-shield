<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Dulu: test page</title>
<style>
  :root {
    --bg: #f4f1ea; --ink: #1d1d1b; --muted: #6b675e; --line: #d9d3c5; --card: #fffdf8;
    --aman: #2f7d4f; --waspada: #b7791f; --bahaya: #c0392b; --wa: #e7f8d4; --accent: #1d1d1b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px;
         display: grid; grid-template-columns: 1fr 380px; gap: 28px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; font: inherit; padding: 12px; border: 1px solid var(--line);
             border-radius: 10px; background: #fff; resize: vertical; }
  #token { width: 100%; max-width: 320px; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
           border-radius: 8px; background: #fff; }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
  .chip { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line);
          background: #fff; cursor: pointer; }
  .chip:hover { border-color: var(--ink); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .btn { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--ink);
         background: var(--ink); color: #fff; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.rec { border-color: var(--bahaya); color: var(--bahaya); background: transparent; }
  .btn.rec.on { background: var(--bahaya); color: #fff; }
  .file-note { font-size: 13px; color: var(--muted); }
  .phone { background: #ece5dd; border-radius: 22px; padding: 16px; min-height: 420px; border: 1px solid var(--line); }
  .phone h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .bubble { background: var(--wa); border-radius: 10px 10px 2px 10px; padding: 10px 12px; white-space: pre-wrap;
            box-shadow: 0 1px 0 rgba(0,0,0,.08); font-size: 15px; }
  .empty { color: var(--muted); font-size: 14px; }
  .risk { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 6px; color: #fff; font-size: 14px; }
  .AMAN { background: var(--aman); } .WASPADA { background: var(--waspada); } .BAHAYA { background: var(--bahaya); }
  dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; margin: 16px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  details { margin-top: 14px; font-size: 13px; }
  pre { background: #f6f3ec; padding: 10px; border-radius: 8px; overflow: auto; max-height: 280px; }
  .err { color: var(--bahaya); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cek Dulu</h1>
    <p>Test page for the agent core (<code>POST /analyze</code>). On WhatsApp, the parent just forwards the message.</p>
  </header>

  <section class="panel">
    <label for="text">Forwarded message (or image caption)</label>
    <textarea id="text" placeholder="Paste a suspicious message here…"></textarea>
    <div class="samples" id="samples" aria-label="Sample messages"></div>

    <label for="file">Or attach an image (screenshot / QRIS), a voice note, or a video</label>
    <input id="file" type="file" accept="image/*,audio/*,video/*">
    <div class="row">
      <button class="btn rec" id="rec" type="button">● Record voice</button>
      <span class="file-note" id="fileNote"></span>
    </div>

    <label for="token">Demo token (only needed on the deployed site)</label>
    <input id="token" type="password" autocomplete="off" placeholder="ANALYZE_TOKEN">

    <div class="row">
      <button class="btn" id="go" type="button">Check</button>
      <button class="btn ghost" id="clear" type="button">Clear</button>
      <span class="file-note" id="status" role="status"></span>
    </div>

    <dl id="meta" hidden></dl>
    <details id="raw" hidden><summary>Raw JSON</summary><pre id="rawPre"></pre></details>
  </section>

  <aside class="phone" aria-live="polite">
    <h2>WhatsApp reply preview</h2>
    <div id="reply" class="empty">The verdict will show up here.</div>
  </aside>
</main>

<script>
const SAMPLES = {
  "Kurir APK": "Selamat siang, paket Anda tertahan di gudang karena alamat tidak lengkap. Silakan cek resi di aplikasi berikut.\n[File terlampir: Cek_Resi_JNT.apk (application/vnd.android.package-archive)]",
  "Mama minta pulsa": "Ma, ini nomor baru aku ya. Hp lama rusak. Tolong beliin pulsa 100rb dulu ke nomor ini, nanti aku ganti. Penting banget ma",
  "CS bank palsu": "Halo Bapak/Ibu, kami dari CS BCA. Rekening Anda terdeteksi transaksi mencurigakan dan akan DIBLOKIR. Kirim kode OTP yang masuk ke SMS untuk verifikasi. bit.ly/bca-verifikasi",
  "Investasi": "PROFIT 10% PER HARI DIJAMIN!! Modal 500rb jadi 5jt dalam seminggu. Gabung grup VIP sekarang, slot terbatas!",
  "Hoaks kesehatan": "PENTING!! Air rebusan daun sirsak + bawang putih menyembuhkan kanker dan diabetes dalam 3 hari. Sudah terbukti dokter Jepang. Sebarkan ke 10 grup!",
  "Pesan aman": "Ibu-ibu, arisan minggu depan di rumah Tante Rini ya, jam 4 sore. Bawa kue masing-masing 🙏",
};
const $ = (id) => document.getElementById(id);
$("token").value = localStorage.getItem("cekdulu_token") || "";
$("token").addEventListener("change", () => localStorage.setItem("cekdulu_token", $("token").value.trim()));
let recorded = null, recorder = null;

for (const [name, text] of Object.entries(SAMPLES)) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = name;
  b.onclick = () => { $("text").value = text; };
  $("samples").append(b);
}

function esc(s) { return s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function waFormat(s) { return esc(s).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>"); }
function toB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}

$("file").onchange = () => { recorded = null; const f = $("file").files[0]; $("fileNote").textContent = f ? `${f.name} (${Math.round(f.size/1024)} KB)` : ""; };

$("rec").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      recorded = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      $("file").value = ""; $("rec").classList.remove("on"); $("rec").textContent = "● Record voice";
      $("fileNote").textContent = `Voice recorded (${Math.round(recorded.size/1024)} KB)`;
    };
    recorder.start(); $("rec").classList.add("on"); $("rec").textContent = "■ Stop";
  } catch (e) { $("fileNote").textContent = "Microphone not available: " + e.message; }
};

$("clear").onclick = () => {
  $("text").value = ""; $("file").value = ""; recorded = null; $("fileNote").textContent = "";
  $("reply").className = "empty"; $("reply").textContent = "The verdict will show up here.";
  $("meta").hidden = true; $("raw").hidden = true; $("status").textContent = "";
};

$("go").onclick = async () => {
  const blob = recorded || $("file").files[0] || null;
  const text = $("text").value.trim();
  if (!blob && !text) { $("status").textContent = "Type a message or attach a file first."; return; }
  let type = "text";
  if (blob) type = blob.type.startsWith("image/") ? "image" : blob.type.startsWith("video/") ? "video" : "audio";
  else if (/\[File terlampir:/i.test(text)) type = "document";
  const body = { type, text };
  if (blob) { body.media_base64 = await toB64(blob); body.mime = blob.type; }

  $("go").disabled = true; $("status").textContent = "Checking…";
  const t0 = performance.now();
  try {
    const r = await fetch("/analyze", { method: "POST", headers: { "Content-Type": "application/json", "X-Analyze-Token": $("token").value.trim() }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : r.statusText);
    const v = data.verdict;
    $("reply").className = "bubble"; $("reply").innerHTML = waFormat(data.whatsapp_reply);
    $("meta").hidden = false;
    $("meta").innerHTML = `
      <dt>Risk</dt><dd><span class="risk ${esc(v.risk)}">${esc(v.risk)}</span></dd>
      <dt>Category</dt><dd>${esc(v.category)}</dd>
      <dt>Confidence</dt><dd>${(v.confidence * 100).toFixed(0)}%</dd>
      <dt>Decided by</dt><dd>${data.overrides.some((o) => o.field === "risk")
        ? `Muse said <b>${esc(data.model_risk || "?")}</b> → changed by rule: ${esc(data.overrides.filter((o) => o.field === "risk").map((o) => o.rule).join(", "))}`
        : `Muse (${esc(data.model_risk || "fallback")}), no rule changed the risk`}</dd>
      <dt>Tools</dt><dd>${esc(data.tools_used.join(", ") || "none")}</dd>
      <dt>Model</dt><dd>${esc(data.provider || "?")} / ${esc(data.model || "?")}</dd>
      ${data.image_mode ? `<dt>Image mode</dt><dd>${esc(data.image_mode)}</dd>` : ""}
      <dt>Latency</dt><dd>${data.latency_ms} ms server, ${Math.round(performance.now() - t0)} ms total</dd>
      ${data.extracted_text && type !== "text" ? `<dt>Extracted</dt><dd>${esc(data.extracted_text)}</dd>` : ""}`;
    $("raw").hidden = false; $("rawPre").textContent = JSON.stringify(data, null, 2);
    $("status").textContent = "";
  } catch (e) {
    $("status").innerHTML = `<span class="err">Error: ${esc(e.message)}</span>`;
  } finally { $("go").disabled = false; }
};
</script>
</body>
</html>
