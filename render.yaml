services:
  - type: web
    name: cek-dulu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: MUSE_MODEL
        value: muse-spark-1.3
      - key: MUSE_REASONING_EFFORT
        value: low
      - key: ASR_MODEL
        value: muse-voice-transcribe-1.0
      - key: LLM_PROVIDER
        value: meta
      - key: WA_GRAPH_VERSION
        value: v21.0
      - key: WA_GUARDIAN_TEMPLATE
        value: guardian_alert
      - key: WA_TEMPLATE_LANG
        value: id
      # Secrets: set in the Render dashboard (sync: false = never stored in this file)
      - key: META_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_MODEL
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_WABA_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # e.g. https://cek-dulu.onrender.com/telegram/webhook (registered automatically on startup)
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      # Point at Render Postgres once guardian links matter (free disk is wiped on redeploy):
      - key: DATABASE_URL
        sync: false
